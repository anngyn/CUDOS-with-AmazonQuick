<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">FinOps analytical security boundary</title>
  <desc id="description">Sanitized live CLI audit of S3 encryption and public access controls, Athena result encryption, and the Amazon QuickSight datasource role boundary in Sydney.</desc>
  <style>
    .bg { fill:#f5f8fc; }
    .header { fill:#101b33; }
    .card { fill:#ffffff; stroke:#d5dfed; stroke-width:2; }
    .line { stroke:#d5dfed; stroke-width:2; }
    .title { font:700 42px Arial,sans-serif; fill:#ffffff; }
    .subtitle { font:400 21px Arial,sans-serif; fill:#c8d6ed; }
    .cardtitle { font:700 27px Arial,sans-serif; fill:#12213f; }
    .label { font:600 18px Arial,sans-serif; fill:#50617d; }
    .value { font:700 24px Arial,sans-serif; fill:#15274a; }
    .small { font:400 17px Arial,sans-serif; fill:#50617d; }
    .good { fill:#0e8a5f; }
    .goodtext { font:700 18px Arial,sans-serif; fill:#ffffff; }
    .footer { font:600 19px Arial,sans-serif; fill:#12213f; }
  </style>
  <rect class="bg" width="1600" height="900"/>
  <rect class="header" x="0" y="0" width="1600" height="166"/>
  <text class="title" x="80" y="76">FinOps analytical security boundary</text>
  <text class="subtitle" x="80" y="118">Sanitized live CLI audit · ap-southeast-2 (Sydney) · identifiers removed</text>
  <rect class="good" x="1170" y="50" rx="24" ry="24" width="330" height="50"/>
  <text class="goodtext" x="1215" y="82">READ-ORIENTED CONTROLS</text>

  <rect class="card" x="80" y="220" rx="18" ry="18" width="440" height="390"/>
  <circle cx="126" cy="274" r="25" fill="#e7f5ef"/>
  <path d="M115 274l8 8 15-18" fill="none" stroke="#0e8a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardtitle" x="168" y="284">S3 data exports</text>
  <line class="line" x1="112" y1="320" x2="486" y2="320"/>
  <text class="label" x="112" y="365">Default encryption</text>
  <text class="value" x="112" y="400">AES256 (SSE-S3)</text>
  <text class="label" x="112" y="454">Public access block</text>
  <text class="value" x="112" y="489">4 of 4 controls enabled</text>
  <text class="small" x="112" y="548">Bucket name and account ID redacted</text>

  <rect class="card" x="580" y="220" rx="18" ry="18" width="440" height="390"/>
  <circle cx="626" cy="274" r="25" fill="#e7f5ef"/>
  <path d="M615 274l8 8 15-18" fill="none" stroke="#0e8a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardtitle" x="668" y="284">Athena primary workgroup</text>
  <line class="line" x1="612" y1="320" x2="986" y2="320"/>
  <text class="label" x="612" y="365">Workgroup configuration</text>
  <text class="value" x="612" y="400">Enforced</text>
  <text class="label" x="612" y="454">Query-result encryption</text>
  <text class="value" x="612" y="489">SSE-S3</text>
  <text class="small" x="612" y="548">Dedicated result bucket public block: 4 / 4</text>

  <rect class="card" x="1080" y="220" rx="18" ry="18" width="440" height="390"/>
  <circle cx="1126" cy="274" r="25" fill="#e7f5ef"/>
  <path d="M1115 274l8 8 15-18" fill="none" stroke="#0e8a5f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardtitle" x="1168" y="284">QuickSight datasource role</text>
  <line class="line" x1="1112" y1="320" x2="1486" y2="320"/>
  <text class="label" x="1112" y="365">Trusted service</text>
  <text class="value" x="1112" y="400">quicksight.amazonaws.com</text>
  <text class="label" x="1112" y="454">Policy inventory</text>
  <text class="value" x="1112" y="489">2 attached · 1 inline</text>
  <text class="small" x="1112" y="548">Role and policy ARNs redacted</text>

  <rect x="80" y="660" rx="18" ry="18" width="1440" height="165" fill="#eaf3fb" stroke="#b9cde5" stroke-width="2"/>
  <text class="footer" x="122" y="715">Reviewed workload-changing actions: no matches</text>
  <text class="small" x="122" y="751">EC2 termination · RDS deletion · IAM user creation</text>
  <text class="small" x="122" y="787">Scope note: this is a targeted permission review, not a blanket certification of every IAM action.</text>
  <rect class="good" x="1140" y="705" rx="22" ry="22" width="290" height="50"/>
  <text class="goodtext" x="1230" y="738">PASS (REVIEWED)</text>
</svg>
